// SNAP TAP MODE + INPUT OVERLAY
	bind w "+vstr on_mfwd out_mfwd"
	bind a "+vstr on_mleft out_mleft"
	bind s "+vstr on_mback out_mback"
	bind d "+vstr on_mright out_mright"
	
	set on_mfwd  "-back;+forward;+shudkey1; set checkfwd +forward"
	set out_mfwd "-forward;-shudkey1; vstr checkback; set checkfwd +fire"
	
	set on_mleft  "-moveright;+moveleft;+shudkey2; set checkleft +moveleft"
	set out_mleft "-moveleft;-shudkey2; vstr checkright; set checkleft +fire"
	
	set on_mback  "-forward;+back;+shudkey3; set checkback +back"
	set out_mback "-back;-shudkey3; vstr checkfwd; set checkback +fire"
	
	set on_mright  "-moveleft;+moveright;+shudkey4; set checkright +moveright"
	set out_mright "-moveright;-shudkey4; vstr checkleft; set checkright +fire"
	
	bind mouse1 "+attack; +shudkey5"
	bind mouse2 "+zoom; +shudkey6"
	
	bind space "+autojump; +shudkey7"
	bind ctrl  "+movedown; +shudkey8"
