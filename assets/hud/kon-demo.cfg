# HEALTH
!default { fontsize 5 9; textstyle 1; }
PostDecorate  { rect 20 430 32 32; image "gfx/2d/hudres/health_br";}
StatusBar_HealthCount { rect 60 430 0 0; font eternal; fontsize 25 32; textstyle 1; textalign L; }


# ARMOR
!default { fontsize 5 9; textstyle 1; }
PostDecorate   { rect 20 390 32 32; image "gfx/2d/hudres/armor_br";}
StatusBar_ArmorCount  { rect 60 390 0 0; font eternal; fontsize 25 32; textstyle 1; textalign L; }


# Flags
!default{ bgcolor 1 1 1 1; }
FlagStatus_OWN       { rect 554 432 16 19; color T; textalign R; alignv C }
FlagStatus_NME       { rect 554 458 16 19; color E; fontsize 25 32; textalign R; alignv C }

# Fragmessage
!default{ font m1rage; textalign C; fadedelay 500; time 2000; fade 1 1 1 0; textstyle 1; visflags scoreshide }
FragMessage          { rect 320 87 0 0; fontsize 6 10; color 1 1 1 1; }
RankMessage          { rect 320 97 0 0; fontsize 8 11; }

# POWERUP STACK
!default{ bgcolor 0 0 0 0; textalign C; font sansman; fontsize 12 16; }
