#grid 			{ rect -0.5 -0.5 10 10; color 1 1 1 0.1; color2 1 0.5 1 0.1; }

# HEALTH
!default{}
StatusBar_HealthCount { rect 200 430 0 0; font qlnumbers; fontsize 26 33; textstyle 1; textalign C; }


# ARMOR
!default{}
StatusBar_ArmorCount  { rect 448 430 0 0; font qlnumbers; fontsize 26 33; textstyle 1; textalign C; }


# AMMO
!default{}
StatusBar_AmmoCount	{ rect 325 420 16 16; font qlnumbers; fontsize 20 25; textstyle 1; textalign C; }
AmmoMessage         { rect 320 130 0 0; font id; fontsize 10 12; color 1 0 0 0.8; textalign C; }


# Score_OWN
!default{}
Score_OWN            { rect 639 424 0 18; font qlnumbers; textalign R; textstyle 0; fontsize 15 22; color 1 1 1 1; alignv C; }
PreDecorate          { rect 604 420 39 26; image "white"; bgcolor 0 0 0 0.8; color 0.97 0.87 0.49 0.8; } #own team border
PreDecorate          { rect 605 422 34 22; image "white"; bgcolor 0 0 0 0.8; color T; } #own score background



# Score_NME
!default{}
Score_NME            { rect 639 450 0 18; font qlnumbers; textalign R; textstyle 0; fontsize 15 22; color 1 1 1 1; alignv C; }
PreDecorate          { rect 604 448 36 22; image "white"; bgcolor 0 0 0 1; color E; } #enemy score background



# Score_Limit 
!default{ alignh C; }
Score_Limit          { rect 628 392 24 7; font qlnumbers; textalign R; fontsize 16 23; textstyle 0; color 1 1 1 1; }


# Flags
!default{bgcolor 1 1 1 1; }
FlagStatus_OWN        { rect 569 441 16 19; color T; }
FlagStatus_NME        { rect 569 461 16 19; color E; }


# TeamCount
!default{ font qlnumbers; textalign C; alignv C; alignh C; textstyle 0; fontsize 9 13; color 1 1 1 1; bgcolor 0 0 0 0; fill }
