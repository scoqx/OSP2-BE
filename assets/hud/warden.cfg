# HEALTH
StatusBar_HealthBar		{ rect 180 465 130 13; textalign R; color 1 1 1 0.5; color2 0 1 0 0.5; direction R; style 2; doublebar}
#StatusBar_HealthBar		{ rect 180 465 130 13; textalign R; color 1 1 1 1; direction R; style 2; doublebar}
!default { fontsize 5 9; textstyle 1; }
StatusBar_HealthCount { rect 306.5 440 0 0; font eternal; fontsize 17 22; textstyle 1; textalign R; }


# ARMOR
StatusBar_ArmorBar		{ rect 330 465 130 13; textalign L; color 1 1 1 0.5; color2 0 1 0 0.5; style 2; doublebar }
#StatusBar_ArmorBar		{ rect 330 465 130 13; textalign L; color 1 1 1 1; style 2; doublebar }
!default { fontsize 5 9; textstyle 1; }
StatusBar_ArmorCount  { rect 335 440 0 0; font eternal; fontsize 17 22; textstyle 1; textalign L; }


# AMMO
!default{}
AmmoMessage           { rect 320 130 0 0; font sansman; fontsize 10 12; color 1 0 0 0.8; textalign C; }


# OWN TEAM BAR
!default{}
Score_OWN             { rect 623.8 432 0 18; font sansman; textalign C; textstyle 0; fontsize 18 22; color 1 1 1 0.75; alignv C }



# ENEMY TEAM BAR
!default{}
Score_NME             { rect 623.8 451 0 18; font sansman; textalign C; textstyle 0; fontsize 18 22; color 1 1 1 0.75; alignv C }


# TeamCount
!default{ font sansman; textalign C; alignv C; alignh C; textstyle 0; fontsize 18 22; color 1 1 1 1; bgcolor 0 0 0 0; fill; }
TeamCount_OWN        { rect 120 180 10 14; } #TeamCount own
TeamCount_NME        { rect 120 200 10 14; } #TeamCount enemy


# Flags
!default{ bgcolor 1 1 1 1; }
FlagStatus_OWN       { rect 559 433 16 19; color T; textalign R; alignv C }
FlagStatus_NME       { rect 559 459 16 19; color E; textalign R; alignv C }


# Weaponlist
!default{}
WeaponList           { rect 626 200 14 18; font m1rage; fontsize 7 11; textalign R; textstyle 1; color 1 1 1 1; color2 0.3 0.3 0.3 0.6; bgcolor 0 0 0 0; direction T; alignh L; alignv T; monospace; visflags scoreshide }


# CLIENT STATS AND TIMERS
!default{font m1rage; fontsize 6 8; textalign L; textstyle 1; color 1 1 1 0.6; }
