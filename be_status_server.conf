# Настройки BE status server (CI -> scoqx/osp2be-status-server deploy/response.conf [status])
# version и date обновляются автоматически из assets/version.txt и version_changelog.txt
#
# flags: 0 none (update available), 1 hotfix, 2 critical, 4 major, 8 update bar button
flags = 2

#
# hfv — hotfix version - указываются версии, которым 
# будет выводить Update Required!, а не типичный Update Available
#   0 — отключено; одна версия: 1.04f1; список: 1.04e,1.04f,1.04f1
hfv = 0