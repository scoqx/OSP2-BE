!default {
    size 0 0 
    text.size 5 8
    text.font elite 
    text.alignh r
    text.shadow
    text.font sansman
    # pos 0 0 - default
    # color 1 1 1 1 - default
}

    !scoreboard {
    type scoreboard
    pos 320 80
    size 420 400
    extendedtype compact
    visflags dead im
    alignH c

    title {
            pos 0 -76
            size 0 0
            decor {
                type game.gametype
                text.size 16 22
                pos 526 0
            }

            decor {
                type game.serverName
                pos 526 26
            }

            decor {
                type game.map
                pos 526 38
            }
        }
        
    
    !default {
    size 0 0
    text.size 6 9 
    text.shadow
    text.alignH R}

    playersRows {
        pos 1 0
        size 416 400

    title {
        pos 1 4
        size 416 8
        border 0 0 0 2
        bordercolor 0 0 0 1
        rowspacing 4
        compact.rowspacing 2

        print {
            text "S"
            pos 259 0
            compact.text.size 5 8 #fixme
        }

        print {
            text "D"
            pos 299 0 
        }

        print {
            text "DAMAGE"
            pos 369 0
        }

        print {
            text "PING"
            pos 416 0
            color 0.7 0.8 1 1
        }

    }
        playerRow {
            size 0 16
            compact.size 0 14
            bgcolor 0 0 0 0.33
            rowspacing 2    
            
            draw {
                image "gfx/2d/hudres/GradientBox"
                pos 0 8
                size 416 16
                compact.pos 0 7.5
                compact.size 248 15
                color 0 0 0 1
                border 1 1 1 1
                bordercolor 1 1 1 0.5
                visflags activePlayer
            }


            draw {
                type player.skill
                pos 2 8
                size 12 12
            }

            draw {
                type player.head
                pos 16 8
                size 14 14
            }

            draw {
                pos 16 8
                type player.ready
                image
                size 14 14
                color 0.2 1 0.2 1
                visflags ready
            }

            print {
                type player.id
                pos 31 8
                text.size 6 8
                text.alignV b
                text.background 0 0 0 0.5
            }

            print {
                type player.name
                text.size 10 14
                text.alignh l
                pos 32 1
                size 150 0
                maxWidth 220
            }

            !default {
                size 0 0
                text.font sansman
                text.size 10 14
                # text.shadow fix me, need to clear shadow is no shadow in default
                text.alignh R
            }

            decor {
                type player.score
                pos 260 2
            }

            decor {
                type player.deaths
                pos 300 2
                color 0.7 0.7 0.7 1
            }

            decor {
                type player.damageGiven
                pos 370 2
                size 172 0
            }

            decor {
                type player.ping
                pos 416 1
                size 100 0
                color 0.7 0.8 1 0.8
            }
        }

    }

    !default {
    font sansman
    text.size 8 10
    size 0 0
    text.shadow
}

    spectatorsRows {
        pos 1 2
        size 416 0

        spectatorRow {
            pos 0 0
            size 0 10
            rowspacing 0 
            bgcolor 0 0 0 0.33
            rowspacing 1

            print {
                type player.name
                pos 32 0
                maxWidth 200
            }

            draw {
                type player.head
                pos 18 5
                size 10 10
            }

            draw {
                type player.spectator
                image
                pos 3 5
                size 10 10
            }
            
            print {
                type player.ping
                pos 416 1
                color 0.7 0.8 1 0.8
                text.alignH R
            }
        }
    }   
}