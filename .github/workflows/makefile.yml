name: Makefile CI

permissions:
  contents: write

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '*.txt'
      - '.gitignore'
      - 'docs/*'
      - 'build/*'
      - 'util/*'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '*.txt'
      - '.gitignore'
      - 'docs/*'
      - 'build/*'
      - 'util/*'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create version files
        run: |
          cd build/qvm
          make ../../assets/version.txt ../../assets/version_changelog.txt
      
      - name: build-qvm
        working-directory: build/qvm
        run: |
          make

      - name: build-so
        working-directory: build/library
        run: |
          make MOD=osp2

      - uses: actions/upload-artifact@v4
        with:
          name: qvm-linux
          path: build/qvm/zz-osp-pak8be.pk3
          if-no-files-found: error
          retention-days: 5

      - uses: actions/upload-artifact@v4
        with:
          name: cgame-linux
          path: build/library/build/release-linux-x86_64/osp2/cgamex86_64.so
          if-no-files-found: error
          retention-days: 5

      - uses: actions/upload-artifact@v4
        with:
          name: ui-linux
          path: build/library/build/release-linux-x86_64/osp2/uix86_64.so
          if-no-files-found: error
          retention-days: 5

      - name: Package Linux libraries for website
        run: |
          cd build/library/build/release-linux-x86_64/osp2
          zip -j ../../../osp2-be-linux.zip cgamex86_64.so uix86_64.so

      - uses: actions/upload-artifact@v4
        with:
          name: osp2-be-linux
          path: build/library/osp2-be-linux.zip
          if-no-files-found: error
          retention-days: 5

      - uses: actions/upload-artifact@v4
        with:
          name: version-files
          path: |
            assets/version.txt
            assets/version_changelog.txt
          if-no-files-found: error
          retention-days: 5

  create-release:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [linux, mingw]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create latest build
        uses: czietz/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          automatic_release_tag: "latest-build"
          prerelease: false
          title: Latest Build
          files: |
            qvm-linux
            cgame-linux
            ui-linux
            cgame-win
            ui-win

  mingw:
    name: MinGW GCC
    runs-on: windows-2022

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create version files
        run: |
          cd build/qvm
          make ../../assets/version.txt ../../assets/version_changelog.txt

      - name: build-qvm
        working-directory: build/qvm
        run: |
          make

      - name: build-dll
        working-directory: build/library
        run: |
          make MOD=osp2

      - uses: actions/upload-artifact@v4
        with:
          name: cgame-win
          path: build/library/build/release-mingw64-x86_64/osp2/cgamex86_64.dll
          if-no-files-found: error
          retention-days: 5

      - uses: actions/upload-artifact@v4
        with:
          name: ui-win
          path: build/library/build/release-mingw64-x86_64/osp2/uix86_64.dll
          if-no-files-found: error
          retention-days: 5

      - name: Package Windows libraries for website
        run: |
          cd build/library/build/release-mingw64-x86_64/osp2
          if [ -f ../../../osp2-be-win.zip ]; then rm ../../../osp2-be-win.zip; fi
          ../../../../qvm/tools/7za.exe a -tzip -mx=0 ../../../osp2-be-win.zip cgamex86_64.dll uix86_64.dll

      - uses: actions/upload-artifact@v4
        with:
          name: osp2-be-win
          path: build/library/osp2-be-win.zip
          if-no-files-found: error
          retention-days: 5

  deploy-to-gh-pages:
    needs: [linux, mingw]
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: scoqx/scoqx.github.io
      TARGET_BRANCH: main
      GIT_USER_NAME: GitHub Actions
      GIT_USER_EMAIL: actions@github.com
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: |
            qvm-linux
            osp2-be-linux
            osp2-be-win
            version-files
          path: artifacts

      - name: Checkout target repo
        uses: actions/checkout@v3
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: target-repo

      - name: Checkout source repo for config files
        uses: actions/checkout@v3
        with:
          ref: master
          path: source-repo

      - name: Copy artifacts to assets folder
        run: |
          mkdir -p target-repo/assets
          # Copy Linux QVM only (not MinGW) - find file regardless of structure
          find artifacts/qvm-linux -name "*.pk3" -type f -exec cp {} target-repo/assets/zz-osp-pak8be.pk3 \;
          # Copy library zip files
          find artifacts/osp2-be-linux -name "*.zip" -type f -exec cp {} target-repo/assets/osp2-be-linux.zip \;
          find artifacts/osp2-be-win -name "*.zip" -type f -exec cp {} target-repo/assets/osp2-be-win.zip \;
          # Copy version files from artifacts (created during build)
          find artifacts/version-files -name "version.txt" -type f -exec cp {} target-repo/assets/version.txt \;
          find artifacts/version-files -name "version_changelog.txt" -type f -exec cp {} target-repo/assets/version_changelog.txt \;
          # Copy config files from source repo
          cp source-repo/assets/OSP2.cfg target-repo/assets/OSP2.cfg
          cp source-repo/assets/OSP2English.cfg target-repo/assets/OSP2English.cfg
          cp source-repo/changelog_be.txt target-repo/assets/changelog_be.txt

      - name: Commit and push changes
        run: |
          cd target-repo
          git config user.name "${{ env.GIT_USER_NAME }}"
          git config user.email "${{ env.GIT_USER_EMAIL }}"
          git add assets/
          git diff --quiet --cached || git commit -m "Update build artifacts, version files and configs [auto]"
          git push origin ${{ env.TARGET_BRANCH }}
