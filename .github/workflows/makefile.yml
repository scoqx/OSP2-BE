name: Makefile CI

permissions:
  contents: write

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'assets/docs/changelog_be_r.txt'
      - 'assets/version.txt'
      - 'assets/version_changelog.txt'
      - '.gitignore'
      - 'docs/*'
      - 'build/*'
      - 'util/*'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'assets/docs/changelog_be_r.txt'
      - 'assets/version.txt'
      - 'assets/version_changelog.txt'
      - '.gitignore'
      - 'docs/*'
      - 'build/*'
      - 'util/*'
  workflow_dispatch:

jobs:
  sync-version-assets:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Regenerate version.txt and version_changelog.txt
        run: |
          cd build/qvm
          make ../../assets/version.txt ../../assets/version_changelog.txt
          echo "=== version.txt ==="
          cat ../../assets/version.txt
          echo "=== version_changelog.txt (line 1) ==="
          head -1 ../../assets/version_changelog.txt

      - name: Commit and push version assets to OSP2-PBE
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add assets/version.txt assets/version_changelog.txt
          if git diff --staged --quiet; then
            echo "Version assets already up to date in repo"
            exit 0
          fi
          git commit -m "Sync version.txt and version_changelog.txt from osp_version.h [skip ci]"
          git push

  linux:
    needs: sync-version-assets
    if: always() && (needs.sync-version-assets.result == 'success' || needs.sync-version-assets.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: master
          fetch-depth: 0

      - name: Pull latest after version sync
        if: needs.sync-version-assets.result == 'success'
        run: git pull --ff-only origin master

      - name: Create version files
        run: |
          cd build/qvm
          make ../../assets/version.txt ../../assets/version_changelog.txt ../../assets/docs/changelog_be_r.txt

      - name: build-qvm
        working-directory: build/qvm
        run: |
          make

      - name: build-so
        working-directory: build/library
        run: |
          make MOD=osp2

      - uses: actions/upload-artifact@v7
        with:
          name: qvm-linux
          path: build/qvm/zz-osp-pak8be.pk3
          if-no-files-found: error
          retention-days: 5

      - name: Package Linux libraries for website
        run: |
          cd build/library/build/release-linux-x86_64/osp2
          tar -czf ../../../osp2-be-linux.tar.gz cgamex86_64.so uix86_64.so

      - uses: actions/upload-artifact@v7
        with:
          name: osp2-be-linux
          path: build/library/osp2-be-linux.tar.gz
          if-no-files-found: error
          retention-days: 5

  verify-build-artifacts:
    needs: [linux]
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8

      - name: Verify QVM pack and Linux library package
        run: |
          set -e
          missing=0
          check() {
            if [ ! -f "$1" ]; then
              echo "Missing: $1"
              missing=1
            else
              echo "OK: $1 ($(du -h "$1" | cut -f1))"
            fi
          }
          check "qvm-linux/zz-osp-pak8be.pk3"
          check "osp2-be-linux/osp2-be-linux.tar.gz"
          if [ "$missing" -ne 0 ]; then
            echo "Build artifact verification failed"
            exit 1
          fi
          echo "All builds produced required artifacts"

  create-release:
    if: success()
    needs: [verify-build-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Create latest build
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-build
          name: Latest Build
          prerelease: false
          files: |
            qvm-linux/zz-osp-pak8be.pk3
            osp2-be-linux/osp2-be-linux.tar.gz
          generate_release_notes: false

  # Deploy build artifacts to https://q3a.space/osp2/assets/ over SSH (not GitHub).
  # Requires GitHub Environment "q3a-deploy" (Required reviewers) and secrets:
  #   Q3A_DEPLOY_SSH_KEY  — private key (prefer restrict+command= on server authorized_keys)
  #   Q3A_DEPLOY_HOST     — optional, default 5.188.224.180
  #   Q3A_DEPLOY_USER     — optional, default root
  # Server path: /opt/ruthless-stats/web/osp2/assets/
  deploy-to-q3a-space:
    needs: [verify-build-artifacts]
    if: success()
    runs-on: ubuntu-latest
    environment: q3a-deploy
    env:
      REMOTE_ASSETS: /opt/ruthless-stats/web/osp2/assets
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Checkout source repo for config and version files
        uses: actions/checkout@v6
        with:
          ref: master
          path: source-repo

      - name: Stage deploy-assets
        run: |
          set -euo pipefail
          mkdir -p deploy-assets
          copy_fail=0

          find_and_copy() {
            local filename="$1"
            local dest="$2"
            local found_file
            found_file=$(find artifacts -name "$filename" -type f 2>/dev/null | head -1)
            if [ -n "$found_file" ] && [ -f "$found_file" ]; then
              cp "$found_file" "$dest"
              echo "Copied: $found_file -> $dest ($(du -h "$dest" | cut -f1))"
              return 0
            fi
            echo "ERROR: $filename not found in artifacts"
            copy_fail=1
            return 1
          }

          find_and_copy "zz-osp-pak8be.pk3" "deploy-assets/zz-osp-pak8be.pk3" || true
          find_and_copy "osp2-be-linux.tar.gz" "deploy-assets/osp2-be-linux.tar.gz" || true

          if [ "$copy_fail" -ne 0 ]; then
            echo "ERROR: Required build artifacts missing; refusing to deploy"
            exit 1
          fi

          for src_dst in \
            "source-repo/assets/version.txt:deploy-assets/version.txt" \
            "source-repo/assets/version_changelog.txt:deploy-assets/version_changelog.txt" \
            "source-repo/assets/OSP2.cfg:deploy-assets/OSP2.cfg" \
            "source-repo/assets/OSP2English.cfg:deploy-assets/OSP2English.cfg" \
            "source-repo/changelog_be.txt:deploy-assets/changelog_be.txt"; do
            src="${src_dst%%:*}"
            dst="${src_dst##*:}"
            if [ -f "$src" ]; then
              cp "$src" "$dst"
              echo "Copied: $src -> $dst"
            else
              echo "ERROR: $src not found"
              exit 1
            fi
          done

          echo "=== Staging deploy-assets ==="
          ls -lh deploy-assets/

          required_files=(
            "zz-osp-pak8be.pk3"
            "osp2-be-linux.tar.gz"
            "version.txt"
            "version_changelog.txt"
            "OSP2.cfg"
            "OSP2English.cfg"
            "changelog_be.txt"
          )
          for file in "${required_files[@]}"; do
            if [ ! -f "deploy-assets/$file" ]; then
              echo "ERROR: Required file missing: $file"
              exit 1
            fi
          done

      - name: Setup SSH
        env:
          Q3A_DEPLOY_SSH_KEY: ${{ secrets.Q3A_DEPLOY_SSH_KEY }}
          Q3A_DEPLOY_HOST: ${{ secrets.Q3A_DEPLOY_HOST }}
          Q3A_DEPLOY_USER: ${{ secrets.Q3A_DEPLOY_USER }}
        run: |
          set -euo pipefail
          if [ -z "${Q3A_DEPLOY_SSH_KEY:-}" ]; then
            echo "ERROR: secret Q3A_DEPLOY_SSH_KEY is not set"
            exit 1
          fi
          HOST="${Q3A_DEPLOY_HOST:-5.188.224.180}"
          USER="${Q3A_DEPLOY_USER:-root}"
          echo "Q3A_DEPLOY_HOST=$HOST" >> "$GITHUB_ENV"
          echo "Q3A_DEPLOY_USER=$USER" >> "$GITHUB_ENV"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$Q3A_DEPLOY_SSH_KEY" > ~/.ssh/q3a_deploy
          chmod 600 ~/.ssh/q3a_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync assets to q3a.space
        run: |
          set -euo pipefail
          rsync -avz --chmod=ugo=rwX \
            -e "ssh -i ~/.ssh/q3a_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            deploy-assets/ \
            "${Q3A_DEPLOY_USER}@${Q3A_DEPLOY_HOST}:${REMOTE_ASSETS}/"

      - name: Verify remote assets
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/q3a_deploy -o IdentitiesOnly=yes \
            "${Q3A_DEPLOY_USER}@${Q3A_DEPLOY_HOST}" \
            "test -f ${REMOTE_ASSETS}/version.txt && test -f ${REMOTE_ASSETS}/zz-osp-pak8be.pk3 && ls -lh ${REMOTE_ASSETS}/version.txt ${REMOTE_ASSETS}/zz-osp-pak8be.pk3 ${REMOTE_ASSETS}/osp2-be-linux.tar.gz && curl -m 5 -sf -o /dev/null -w 'version=%{http_code}\n' http://127.0.0.1:8080/osp2/assets/version.txt"

  deploy-to-status-server:
    needs: [verify-build-artifacts]
    if: success()
    runs-on: ubuntu-latest
    env:
      STATUS_REPO: scoqx/osp2be-status-server
      STATUS_BRANCH: main
      GIT_USER_NAME: GitHub Actions
      GIT_USER_EMAIL: actions@github.com
    steps:
      - name: Checkout OSP2-PBE (latest master after version sync)
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive
          path: source-repo

      - name: Pull latest master
        run: git -C source-repo pull --ff-only origin master

      - name: Build fresh version.txt and version_changelog.txt
        run: |
          cd source-repo/build/qvm
          make ../../assets/version.txt ../../assets/version_changelog.txt
          echo "=== version.txt ==="
          cat ../../assets/version.txt
          echo "=== version_changelog.txt (line 1) ==="
          head -1 ../../assets/version_changelog.txt

      - name: Checkout osp2be-status-server
        uses: actions/checkout@v6
        with:
          repository: ${{ env.STATUS_REPO }}
          ref: ${{ env.STATUS_BRANCH }}
          token: ${{ secrets.BE_SERVER_STATUS }}
          path: status-repo

      - name: Patch response.conf and version_changelog.txt
        run: |
          python3 source-repo/scripts/patch_osp2be_status_server.py \
            --version-txt source-repo/assets/version.txt \
            --changelog source-repo/assets/version_changelog.txt \
            --status-config source-repo/be_status_server.conf \
            --status-dir status-repo

      - name: Update mod_sig in deploy/response.conf
        working-directory: status-repo
        run: python3 gen_status_sig.py --write -c deploy/response.conf

      - name: Commit and push to osp2be-status-server
        run: |
          cd status-repo
          git config user.name "${{ env.GIT_USER_NAME }}"
          git config user.email "${{ env.GIT_USER_EMAIL }}"
          git add deploy/version_changelog.txt deploy/response.conf
          git diff --quiet --cached || git commit -m "Update version_changelog and status version [auto]"
          git push origin ${{ env.STATUS_BRANCH }}
