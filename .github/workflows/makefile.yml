name: Makefile CI

permissions:
  contents: write

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'assets/docs/changelog_be_r.txt'
      - 'assets/version.txt'
      - 'assets/version_changelog.txt'
      - '.gitignore'
      - 'docs/*'
      - 'build/*'
      - 'util/*'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - 'assets/docs/changelog_be_r.txt'
      - 'assets/version.txt'
      - 'assets/version_changelog.txt'
      - '.gitignore'
      - 'docs/*'
      - 'build/*'
      - 'util/*'
  workflow_dispatch:

jobs:
  sync-version-assets:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Regenerate version.txt and version_changelog.txt
        run: |
          cd build/qvm
          make ../../assets/version.txt ../../assets/version_changelog.txt
          echo "=== version.txt ==="
          cat ../../assets/version.txt
          echo "=== version_changelog.txt (line 1) ==="
          head -1 ../../assets/version_changelog.txt

      - name: Commit and push version assets to OSP2-PBE
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add assets/version.txt assets/version_changelog.txt
          if git diff --staged --quiet; then
            echo "Version assets already up to date in repo"
            exit 0
          fi
          git commit -m "Sync version.txt and version_changelog.txt from osp_version.h [skip ci]"
          git push

  linux:
    needs: sync-version-assets
    if: always() && (needs.sync-version-assets.result == 'success' || needs.sync-version-assets.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: master
          fetch-depth: 0

      - name: Pull latest after version sync
        if: needs.sync-version-assets.result == 'success'
        run: git pull --ff-only origin master

      - name: Create version files
        run: |
          cd build/qvm
          make ../../assets/version.txt ../../assets/version_changelog.txt ../../assets/docs/changelog_be_r.txt

      - name: build-qvm
        working-directory: build/qvm
        run: |
          make

      - name: build-so
        working-directory: build/library
        run: |
          make MOD=osp2

      - uses: actions/upload-artifact@v7
        with:
          name: qvm-linux
          path: build/qvm/zz-osp-pak8be.pk3
          if-no-files-found: error
          retention-days: 5

      - name: Package Linux libraries for website
        run: |
          cd build/library/build/release-linux-x86_64/osp2
          tar -czf ../../../osp2-be-linux.tar.gz cgamex86_64.so uix86_64.so

      - uses: actions/upload-artifact@v7
        with:
          name: osp2-be-linux
          path: build/library/osp2-be-linux.tar.gz
          if-no-files-found: error
          retention-days: 5

  verify-build-artifacts:
    needs: [linux]
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8

      - name: Verify QVM pack and Linux library package
        run: |
          set -e
          missing=0
          check() {
            if [ ! -f "$1" ]; then
              echo "Missing: $1"
              missing=1
            else
              echo "OK: $1 ($(du -h "$1" | cut -f1))"
            fi
          }
          check "qvm-linux/zz-osp-pak8be.pk3"
          check "osp2-be-linux/osp2-be-linux.tar.gz"
          if [ "$missing" -ne 0 ]; then
            echo "Build artifact verification failed"
            exit 1
          fi
          echo "All builds produced required artifacts"

  # Publish downloads to https://github.com/scoqx/osp2-be/releases/tag/latest
  # Requires secret OSP2_BE_RELEASE_TOKEN (fine-grained PAT, Contents: Write on scoqx/osp2-be).
  create-release:
    if: success()
    needs: [verify-build-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Checkout source for version files
        uses: actions/checkout@v6
        with:
          ref: master
          path: source-repo

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp qvm-linux/zz-osp-pak8be.pk3 release-assets/zz-osp-pak8be.pk3
          cp osp2-be-linux/osp2-be-linux.tar.gz release-assets/osp2-be-linux.tar.gz
          cp source-repo/assets/version.txt release-assets/version.txt
          cp source-repo/assets/version_changelog.txt release-assets/version_changelog.txt
          cp source-repo/changelog_be.txt release-assets/changelog_be.txt
          ls -lh release-assets/

      - name: Publish to scoqx/osp2-be (tag latest)
        uses: softprops/action-gh-release@v3
        with:
          repository: scoqx/osp2-be
          token: ${{ secrets.OSP2_BE_RELEASE_TOKEN }}
          tag_name: latest
          name: Latest
          prerelease: false
          make_latest: true
          files: |
            release-assets/zz-osp-pak8be.pk3
            release-assets/osp2-be-linux.tar.gz
            release-assets/version.txt
            release-assets/version_changelog.txt
            release-assets/changelog_be.txt
          generate_release_notes: false
          body: |
            OSP2-BE download assets. Stable URLs use `/releases/latest/download/<file>`.

      # Site UI (GitHub Pages) reads cfg/version from scoqx/osp2-be main (assets/ + root copies).
      - name: Mirror cfg and version text to scoqx/osp2-be main
        env:
          TOKEN: ${{ secrets.OSP2_BE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/scoqx/osp2-be.git" mirror-repo
          mkdir -p mirror-repo/assets
          cp release-assets/version.txt mirror-repo/version.txt
          cp release-assets/version_changelog.txt mirror-repo/version_changelog.txt
          cp release-assets/changelog_be.txt mirror-repo/changelog_be.txt
          cp release-assets/version.txt mirror-repo/assets/version.txt
          cp release-assets/version_changelog.txt mirror-repo/assets/version_changelog.txt
          cp release-assets/changelog_be.txt mirror-repo/assets/changelog_be.txt
          cp source-repo/assets/OSP2.cfg mirror-repo/assets/OSP2.cfg
          cp source-repo/assets/OSP2English.cfg mirror-repo/assets/OSP2English.cfg
          cd mirror-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add version.txt version_changelog.txt changelog_be.txt \
            assets/version.txt assets/version_changelog.txt assets/changelog_be.txt \
            assets/OSP2.cfg assets/OSP2English.cfg
          if git diff --staged --quiet; then
            echo "Site assets already up to date on main"
            exit 0
          fi
          git commit -m "Sync cfg, version.txt, version_changelog.txt, changelog_be.txt"
          git push origin HEAD:main

  deploy-to-status-server:
    needs: [verify-build-artifacts]
    if: success()
    runs-on: ubuntu-latest
    env:
      STATUS_REPO: scoqx/osp2be-status-server
      STATUS_BRANCH: main
      GIT_USER_NAME: GitHub Actions
      GIT_USER_EMAIL: actions@github.com
    steps:
      - name: Checkout OSP2-PBE (latest master after version sync)
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive
          path: source-repo

      - name: Pull latest master
        run: git -C source-repo pull --ff-only origin master

      - name: Build fresh version.txt and version_changelog.txt
        run: |
          cd source-repo/build/qvm
          make ../../assets/version.txt ../../assets/version_changelog.txt
          echo "=== version.txt ==="
          cat ../../assets/version.txt
          echo "=== version_changelog.txt (line 1) ==="
          head -1 ../../assets/version_changelog.txt

      - name: Checkout osp2be-status-server
        uses: actions/checkout@v6
        with:
          repository: ${{ env.STATUS_REPO }}
          ref: ${{ env.STATUS_BRANCH }}
          token: ${{ secrets.BE_SERVER_STATUS }}
          path: status-repo

      - name: Patch response.conf and version_changelog.txt
        run: |
          python3 source-repo/scripts/patch_osp2be_status_server.py \
            --version-txt source-repo/assets/version.txt \
            --changelog source-repo/assets/version_changelog.txt \
            --status-config source-repo/be_status_server.conf \
            --status-dir status-repo

      - name: Update mod_sig in deploy/response.conf
        working-directory: status-repo
        run: python3 gen_status_sig.py --write -c deploy/response.conf

      - name: Commit and push to osp2be-status-server
        run: |
          cd status-repo
          git config user.name "${{ env.GIT_USER_NAME }}"
          git config user.email "${{ env.GIT_USER_EMAIL }}"
          git add deploy/version_changelog.txt deploy/response.conf
          git diff --quiet --cached || git commit -m "Update version_changelog and status version [auto]"
          git push origin ${{ env.STATUS_BRANCH }}
