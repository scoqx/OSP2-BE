name: Makefile CI

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '*.txt'
      - '.gitignore'
      - 'docs/*'
      - 'build/*'
      - 'util/*'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '*.txt'
      - '.gitignore'
      - 'docs/*'
      - 'build/*'
      - 'util/*'
  workflow_dispatch:

jobs:
  linux-qvm:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create version files
        run: |
          cd build/linux-qvm
          make ../../assets/version.txt ../../assets/version_changelog.txt
      
      - name: build
        working-directory: build/linux-qvm
        run: |
          make

      - uses: actions/upload-artifact@v4
        with:
          name: qvm
          path: build/linux-qvm/zz-osp-pak8be.pk3
          if-no-files-found: error
          retention-days: 5

  linux-so:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: build
        working-directory: build/linux
        run: |
          make MOD=osp2

      - uses: actions/upload-artifact@v4
        with:
          name: so
          path: build/linux/build/release-linux-x86_64/osp2/cgamex86_64.so
          if-no-files-found: error
          retention-days: 5

  deploy-to-gh-pages:
    needs: [linux-qvm, linux-so]
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: scoqx/scoqx.github.io
      TARGET_BRANCH: main
      GIT_USER_NAME: GitHub Actions
      GIT_USER_EMAIL: actions@github.com
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*'
          path: artifacts

      - name: Checkout target repo
        uses: actions/checkout@v3
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: target-repo

      - name: Copy artifacts to assets folder
        run: |
          mkdir -p target-repo/assets
          cp artifacts/qvm/zz-osp-pak8be.pk3 target-repo/assets/
          cp artifacts/so/cgamex86_64.so target-repo/assets/

      - name: Commit and push changes
        run: |
          cd target-repo
          git config user.name "${{ env.GIT_USER_NAME }}"
          git config user.email "${{ env.GIT_USER_EMAIL }}"
          git add assets/zz-osp-pak8be.pk3 assets/cgamex86_64.so
          git diff --quiet --cached || git commit -m "Update zz-osp-pak8be.pk3 and cgamex86_64.so [auto]"
          git push origin ${{ env.TARGET_BRANCH }}
