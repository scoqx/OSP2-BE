name: Makefile CI

permissions:
  contents: write

on:
  push:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '*.txt'
      - '.gitignore'
      - 'docs/*'
      - 'build/*'
      - 'util/*'
  pull_request:
    branches: [ "master" ]
    paths-ignore:
      - '**.md'
      - '*.txt'
      - '.gitignore'
      - 'docs/*'
      - 'build/*'
      - 'util/*'
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create version files
        run: |
          cd build/qvm
          make ../../assets/version.txt ../../assets/version_changelog.txt
      
      - name: build-qvm
        working-directory: build/qvm
        run: |
          make

      - name: build-so
        working-directory: build/library
        run: |
          make MOD=osp2

      - uses: actions/upload-artifact@v4
        with:
          name: qvm-linux
          path: build/qvm/zz-osp-pak8be.pk3
          if-no-files-found: error
          retention-days: 5

      - uses: actions/upload-artifact@v4
        with:
          name: cgame-linux
          path: build/library/build/release-linux-x86_64/osp2/cgamex86_64.so
          if-no-files-found: error
          retention-days: 5

      - uses: actions/upload-artifact@v4
        with:
          name: ui-linux
          path: build/library/build/release-linux-x86_64/osp2/uix86_64.so
          if-no-files-found: error
          retention-days: 5

      - name: Package Linux libraries for website
        run: |
          cd build/library/build/release-linux-x86_64/osp2
          tar -czf ../../../osp2-be-linux.tar.gz cgamex86_64.so uix86_64.so

      - uses: actions/upload-artifact@v4
        with:
          name: osp2-be-linux
          path: build/library/osp2-be-linux.tar.gz
          if-no-files-found: error
          retention-days: 5

      - uses: actions/upload-artifact@v4
        with:
          name: version-files
          path: |
            assets/version.txt
            assets/version_changelog.txt
          if-no-files-found: error
          retention-days: 5

  create-release:
    if: github.ref == 'refs/heads/master' && github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [linux, mingw]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create latest build
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest-build
          name: Latest Build
          prerelease: false
          files: |
            qvm-linux/zz-osp-pak8be.pk3
            cgame-linux/cgamex86_64.so
            ui-linux/uix86_64.so
            cgame-win/cgamex86_64.dll
            ui-win/uix86_64.dll
          generate_release_notes: false

  mingw:
    name: MinGW GCC
    runs-on: windows-2022

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Create version files
        run: |
          cd build/qvm
          make ../../assets/version.txt ../../assets/version_changelog.txt

      - name: build-qvm
        working-directory: build/qvm
        run: |
          make

      - name: build-dll
        working-directory: build/library
        run: |
          make MOD=osp2

      - uses: actions/upload-artifact@v4
        with:
          name: cgame-win
          path: build/library/build/release-mingw64-x86_64/osp2/cgamex86_64.dll
          if-no-files-found: error
          retention-days: 5

      - uses: actions/upload-artifact@v4
        with:
          name: ui-win
          path: build/library/build/release-mingw64-x86_64/osp2/uix86_64.dll
          if-no-files-found: error
          retention-days: 5

      - name: Package Windows libraries for website
        run: |
          cd build/library/build/release-mingw64-x86_64/osp2
          if [ -f ../../../osp2-be-win.zip ]; then rm ../../../osp2-be-win.zip; fi
          ../../../../qvm/tools/7za.exe a -tzip -mx=0 ../../../osp2-be-win.zip cgamex86_64.dll uix86_64.dll

      - uses: actions/upload-artifact@v4
        with:
          name: osp2-be-win
          path: build/library/osp2-be-win.zip
          if-no-files-found: error
          retention-days: 5

  deploy-to-gh-pages:
    needs: [linux, mingw]
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: scoqx/scoqx.github.io
      TARGET_BRANCH: main
      GIT_USER_NAME: GitHub Actions
      GIT_USER_EMAIL: actions@github.com
    steps:
      - name: Download artifacts
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: |
            qvm-linux
            osp2-be-linux
            osp2-be-win
            version-files
          path: artifacts

      - name: Debug artifacts structure
        run: |
          echo "Artifacts directory structure:"
          if [ -d artifacts ]; then
            ls -la artifacts/
            echo "Files in artifacts:"
            find artifacts -type f || echo "No files found in artifacts"
          else
            echo "Warning: artifacts directory does not exist"
            mkdir -p artifacts
          fi

      - name: Checkout target repo
        uses: actions/checkout@v3
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: target-repo

      - name: Checkout source repo for config files
        uses: actions/checkout@v3
        with:
          ref: master
          path: source-repo

      - name: Copy artifacts to assets folder
        run: |
          mkdir -p target-repo/assets
          
          # Function to copy file with fallback paths
          copy_file() {
            local src="$1"
            local dst="$2"
            if [ -f "$src" ]; then
              cp "$src" "$dst" && echo "Copied: $src -> $dst"
              return 0
            fi
            return 1
          }
          
          # Copy Linux QVM (zz-osp-pak8be.pk3)
          if ! copy_file "artifacts/qvm-linux/zz-osp-pak8be.pk3" "target-repo/assets/zz-osp-pak8be.pk3"; then
            if ! copy_file "artifacts/qvm-linux" "target-repo/assets/zz-osp-pak8be.pk3"; then
              if find artifacts -name "zz-osp-pak8be.pk3" -exec cp {} target-repo/assets/ \; 2>/dev/null; then
                echo "Found zz-osp-pak8be.pk3 via find"
              else
                echo "Warning: zz-osp-pak8be.pk3 not found in artifacts"
              fi
            fi
          fi
          
          # Copy Linux libraries archive (osp2-be-linux.tar.gz)
          if ! copy_file "artifacts/osp2-be-linux/osp2-be-linux.tar.gz" "target-repo/assets/osp2-be-linux.tar.gz"; then
            if ! copy_file "artifacts/osp2-be-linux" "target-repo/assets/osp2-be-linux.tar.gz"; then
              found_file=$(find artifacts -name "osp2-be-linux.tar.gz" -type f | head -1)
              if [ -n "$found_file" ] && [ -f "$found_file" ]; then
                cp "$found_file" "target-repo/assets/osp2-be-linux.tar.gz"
                echo "Found and copied osp2-be-linux.tar.gz via find from: $found_file"
              else
                echo "Warning: osp2-be-linux.tar.gz not found in artifacts"
              fi
            fi
          fi
          
          # Verify Linux archive was copied
          if [ -f "target-repo/assets/osp2-be-linux.tar.gz" ]; then
            echo "Verified: osp2-be-linux.tar.gz copied successfully ($(du -h target-repo/assets/osp2-be-linux.tar.gz | cut -f1))"
          else
            echo "ERROR: osp2-be-linux.tar.gz was not copied!"
          fi
          
          # Copy Windows libraries archive (osp2-be-win.zip)
          if ! copy_file "artifacts/osp2-be-win/osp2-be-win.zip" "target-repo/assets/osp2-be-win.zip"; then
            if ! copy_file "artifacts/osp2-be-win" "target-repo/assets/osp2-be-win.zip"; then
              found_file=$(find artifacts -name "osp2-be-win.zip" -type f | head -1)
              if [ -n "$found_file" ] && [ -f "$found_file" ]; then
                cp "$found_file" "target-repo/assets/osp2-be-win.zip"
                echo "Found and copied osp2-be-win.zip via find from: $found_file"
              else
                echo "Warning: osp2-be-win.zip not found in artifacts"
              fi
            fi
          fi
          
          # Verify Windows archive was copied
          if [ -f "target-repo/assets/osp2-be-win.zip" ]; then
            echo "Verified: osp2-be-win.zip copied successfully ($(du -h target-repo/assets/osp2-be-win.zip | cut -f1))"
          else
            echo "ERROR: osp2-be-win.zip was not copied!"
          fi
          
          # Copy version files from artifacts
          if ! copy_file "artifacts/version-files/version.txt" "target-repo/assets/version.txt"; then
            if find artifacts -name "version.txt" -exec cp {} target-repo/assets/ \; 2>/dev/null; then
              echo "Found version.txt via find"
            else
              echo "Warning: version.txt not found in artifacts"
            fi
          fi
          
          if ! copy_file "artifacts/version-files/version_changelog.txt" "target-repo/assets/version_changelog.txt"; then
            if find artifacts -name "version_changelog.txt" -exec cp {} target-repo/assets/ \; 2>/dev/null; then
              echo "Found version_changelog.txt via find"
            else
              echo "Warning: version_changelog.txt not found in artifacts"
            fi
          fi
          
          # Copy config files from source repo (always copy, fail if missing)
          if [ -f source-repo/assets/OSP2.cfg ]; then
            cp source-repo/assets/OSP2.cfg target-repo/assets/OSP2.cfg
            echo "Copied: OSP2.cfg"
          else
            echo "Error: OSP2.cfg not found in source-repo/assets/"
          fi
          
          if [ -f source-repo/assets/OSP2English.cfg ]; then
            cp source-repo/assets/OSP2English.cfg target-repo/assets/OSP2English.cfg
            echo "Copied: OSP2English.cfg"
          else
            echo "Error: OSP2English.cfg not found in source-repo/assets/"
          fi
          
          if [ -f source-repo/changelog_be.txt ]; then
            cp source-repo/changelog_be.txt target-repo/assets/changelog_be.txt
            echo "Copied: changelog_be.txt"
          else
            echo "Error: changelog_be.txt not found in source-repo/"
          fi
          
          # List all copied files
          echo ""
          echo "=== Files in target-repo/assets ==="
          ls -lh target-repo/assets/ || echo "Assets directory is empty"
          echo ""
          echo "=== File count ==="
          ls -1 target-repo/assets/ | wc -l || echo "0"
          
          # Verify critical files are present
          echo ""
          echo "=== Verification of critical files ==="
          for file in "zz-osp-pak8be.pk3" "osp2-be-linux.tar.gz" "osp2-be-win.zip"; do
            if [ -f "target-repo/assets/$file" ]; then
              echo "✓ $file exists ($(du -h target-repo/assets/$file | cut -f1))"
            else
              echo "✗ $file MISSING!"
            fi
          done

      - name: Verify files before commit
        run: |
          echo "=== Verifying files in target-repo/assets ==="
          cd target-repo
          if [ ! -d assets ]; then
            echo "ERROR: assets directory does not exist!"
            exit 1
          fi
          
          echo "Files found:"
          ls -lh assets/ || echo "No files found"
          
          # Check for required files
          required_files=(
            "OSP2.cfg"
            "OSP2English.cfg"
            "changelog_be.txt"
          )
          
          # Check for optional but expected files
          expected_files=(
            "zz-osp-pak8be.pk3"
            "osp2-be-linux.tar.gz"
            "osp2-be-win.zip"
            "version.txt"
            "version_changelog.txt"
          )
          
          missing_files=()
          for file in "${required_files[@]}"; do
            if [ ! -f "assets/$file" ]; then
              missing_files+=("$file")
              echo "WARNING: Required file missing: $file"
            else
              echo "OK: $file exists ($(du -h assets/$file | cut -f1))"
            fi
          done
          
          for file in "${expected_files[@]}"; do
            if [ ! -f "assets/$file" ]; then
              echo "WARNING: Expected file missing: $file"
            else
              echo "OK: $file exists ($(du -h assets/$file | cut -f1))"
            fi
          done
          
          if [ ${#missing_files[@]} -gt 0 ]; then
            echo "ERROR: Some required files are missing!"
            exit 1
          fi
          
          echo "=== File verification complete ==="

      - name: Commit and push changes
        run: |
          cd target-repo
          git config user.name "${{ env.GIT_USER_NAME }}"
          git config user.email "${{ env.GIT_USER_EMAIL }}"
          
          # Show git status before adding
          echo "=== Git status before add ==="
          git status
          
          # Add all files in assets directory (force add)
          git add -A assets/
          git add -f assets/ || true
          
          # Explicitly add archive files to ensure they are tracked
          if [ -f "assets/osp2-be-linux.tar.gz" ]; then
            git add -f assets/osp2-be-linux.tar.gz
            echo "Explicitly added osp2-be-linux.tar.gz"
          fi
          if [ -f "assets/osp2-be-win.zip" ]; then
            git add -f assets/osp2-be-win.zip
            echo "Explicitly added osp2-be-win.zip"
          fi
          if [ -f "assets/zz-osp-pak8be.pk3" ]; then
            git add -f assets/zz-osp-pak8be.pk3
            echo "Explicitly added zz-osp-pak8be.pk3"
          fi
          
          # Show git status after adding
          echo "=== Git status after add ==="
          git status
          
          # Show what will be committed
          echo "=== Files staged for commit ==="
          git diff --cached --name-only || echo "No staged files"
          
          # Show diff to see what changed
          echo "=== Changes to be committed ==="
          git diff --cached --stat || echo "No changes"
          
          # Check if there are any changes (staged or unstaged)
          if [ -n "$(git status --porcelain)" ]; then
            echo "Changes detected, committing..."
            git commit -m "Update build artifacts, version files and configs [auto]"
            echo "=== Commit created ==="
            git log -1 --stat
            echo "=== Pushing to ${{ env.TARGET_BRANCH }} ==="
            git push origin ${{ env.TARGET_BRANCH }} || {
              echo "ERROR: Push failed!"
              echo "Checking remote configuration..."
              git remote -v
              exit 1
            }
            echo "Changes committed and pushed successfully"
          else
            echo "No changes detected in repository"
            echo "=== Current files in assets ==="
            ls -lh assets/ || echo "Assets directory is empty or missing"
            echo "=== Git log (last 3 commits) ==="
            git log -3 --oneline
          fi
          
          # Verify files are present
          echo ""
          echo "=== Final verification: files in assets ==="
          ls -lh assets/ || echo "Assets directory is empty or missing"
