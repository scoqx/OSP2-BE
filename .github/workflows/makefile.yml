name: Makefile CI

permissions:
  contents: write

on:
  push:
    branches: ["master"]
    paths-ignore:
      - '**.md'
      - 'assets/docs/changelog_be_r.txt'
      - 'assets/version.txt'
      - 'assets/version_changelog.txt'
      - '.gitignore'
      - 'docs/*'
      - 'build/*'
      - 'util/*'
  # pull_request:
  #   branches: ["master"]
  #   paths-ignore:
  #     - '**.md'
  #     - 'assets/docs/changelog_be_r.txt'
  #     - 'assets/version.txt'
  #     - 'assets/version_changelog.txt'
  #     - '.gitignore'
  #     - 'docs/*'
  #     - 'build/*'
  #     - 'util/*'
  workflow_dispatch:

jobs:
  sync-version-assets:
    # if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Regenerate version.txt and version_changelog.txt
        run: |
          python3 ./tools/parse_changelog.py changelog_be.txt assets/version.txt assets/version_changelog.txt
          echo "=== version.txt ==="
          cat assets/version.txt
          echo "=== version_changelog.txt (line 1) ==="
          head -1 assets/version_changelog.txt

      # - name: Commit and push version assets to OSP2-PBE
      #   run: |
      #     git config user.name "GitHub Actions"
      #     git config user.email "actions@github.com"
      #     git add assets/version.txt assets/version_changelog.txt
      #     if git diff --staged --quiet; then
      #       echo "Version assets already up to date in repo"
      #       exit 0
      #     fi
      #     git commit -m "Sync version.txt and version_changelog.txt from osp_version.h [skip ci]"
      #     git push

  linux:
    # needs: sync-version-assets
    # if: always() && (needs.sync-version-assets.result == 'success' || needs.sync-version-assets.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: master
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt install -y cmake 7zip

      - uses: actions/checkout@v6
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '>=3.10'

      - name: Pull latest after version sync
        if: needs.sync-version-assets.result == 'success'
        run: git pull --ff-only origin master

      - name: Create version files
        run: |
          python3 ./tools/parse_changelog.py changelog_be.txt assets/version.txt assets/version_changelog.txt assets/docs/changelog_be_r.txt

      - name: Build qvm
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_MOD_LIBRARIES=OFF -DBUILD_MOD_PK3=ON -DBUILD_MOD_QVMS=ON -DBUILD_TESTS=OFF
          cmake --build build
  
      - name: Build native libraries
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_MOD_LIBRARIES=ON -DBUILD_MOD_PK3=OFF -DBUILD_MOD_QVMS=OFF -DBUILD_TESTS=OFF
          cmake --build build

      - uses: actions/upload-artifact@v7
        with:
          name: qvm-linux
          path: build/Release/osp/zz-osp-pak8be.pk3
          if-no-files-found: error
          retention-days: 5

      - name: Package Linux libraries for website
        run: |
          cd build/Release/osp
          tar -czf osp2-be-linux.tar.gz cgamex86_64.so uix86_64.so

      - uses: actions/upload-artifact@v7
        with:
          name: osp2-be-linux
          path: build/Release/osp/osp2-be-linux.tar.gz
          if-no-files-found: error
          retention-days: 5

  windows-mingw:
    # needs: sync-version-assets
    # if: always() && (needs.sync-version-assets.result == 'success' || needs.sync-version-assets.result == 'skipped')
    name: Windows MinGW

    runs-on: windows-2022

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build native libraries
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_MOD_LIBRARIES=ON -DBUILD_MOD_PK3=OFF -DBUILD_MOD_QVMS=OFF -DBUILD_TESTS=OFF
          cmake --build build --config Release

      - name: Package Windows libraries for website
        run: |
          cd build/Release/osp
          ../../../tools/7za.exe a -tzip osp2-be-windows.zip cgamex86_64.dll uix86_64.dll

      - uses: actions/upload-artifact@v7
        with:
          name: osp2-be-windows
          path: build/Release/osp/osp2-be-windows.zip
          if-no-files-found: error
          retention-days: 5

  verify-build-artifacts:
    needs: [linux, windows-mingw]
    # if: >-
    #   github.ref == 'refs/heads/master' &&
    #   (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
    #   needs.linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8

      - name: Verify QVM pack and Linux library package
        run: |
          set -e
          missing=0
          check() {
            if [ ! -f "$1" ]; then
              echo "Missing: $1"
              missing=1
            else
              echo "OK: $1 ($(du -h "$1" | cut -f1))"
            fi
          }
          check "qvm-linux/zz-osp-pak8be.pk3"
          check "osp2-be-linux/osp2-be-linux.tar.gz"
          check "osp2-be-windows/osp2-be-windows.zip"
          if [ "$missing" -ne 0 ]; then
            echo "Build artifact verification failed"
            exit 1
          fi
          echo "All builds produced required artifacts"

  # Publish downloads to this repo's release tag latest.
  # GITHUB_TOKEN creates the release. OSP2_BE_RELEASE_TOKEN is only for scoqx/osp2-be-web.
  create-release:
    if: success()
    needs: [verify-build-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Checkout source for version files
        uses: actions/checkout@v6
        with:
          ref: master
          path: source-repo

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp qvm-linux/zz-osp-pak8be.pk3 release-assets/zz-osp-pak8be.pk3
          cp osp2-be-linux/osp2-be-linux.tar.gz release-assets/osp2-be-linux.tar.gz
          cp osp2-be-windows/osp2-be-windows.zip release-assets/osp2-be-windows.zip
          cp source-repo/assets/version.txt release-assets/version.txt
          cp source-repo/assets/version_changelog.txt release-assets/version_changelog.txt
          cp source-repo/changelog_be.txt release-assets/changelog_be.txt
          ls -lh release-assets/

      - name: Publish to scoqx/osp2-be (tag latest)
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ github.token }}
          tag_name: latest
          name: Latest
          prerelease: false
          make_latest: true
          files: |
            release-assets/zz-osp-pak8be.pk3
            release-assets/osp2-be-linux.tar.gz
            release-assets/osp2-be-windows.zip
            release-assets/version.txt
            release-assets/version_changelog.txt
            release-assets/changelog_be.txt
          generate_release_notes: false
          body: |
            OSP2-BE download assets. Stable URLs use `/releases/latest/download/<file>`.

      # Site UI (GitHub Pages) reads cfg/version from scoqx/osp2-be-web main (assets/ + root copies).
      # PAT needs Contents: Read and write on scoqx/osp2-be-web only.
      - name: Mirror cfg and version text to scoqx/osp2-be-web main
        env:
          TOKEN: ${{ secrets.OSP2_BE_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/scoqx/osp2-be-web.git" mirror-repo
          mkdir -p mirror-repo/assets
          cp release-assets/version.txt mirror-repo/version.txt
          cp release-assets/version_changelog.txt mirror-repo/version_changelog.txt
          cp release-assets/changelog_be.txt mirror-repo/changelog_be.txt
          cp release-assets/version.txt mirror-repo/assets/version.txt
          cp release-assets/version_changelog.txt mirror-repo/assets/version_changelog.txt
          cp release-assets/changelog_be.txt mirror-repo/assets/changelog_be.txt
          cp source-repo/assets/OSP2.cfg mirror-repo/assets/OSP2.cfg
          cp source-repo/assets/OSP2English.cfg mirror-repo/assets/OSP2English.cfg
          cd mirror-repo
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add version.txt version_changelog.txt changelog_be.txt \
            assets/version.txt assets/version_changelog.txt assets/changelog_be.txt \
            assets/OSP2.cfg assets/OSP2English.cfg
          if git diff --staged --quiet; then
            echo "Site assets already up to date on main"
            exit 0
          fi
          git commit -m "Sync cfg, version.txt, version_changelog.txt, changelog_be.txt"
          git push origin HEAD:main
