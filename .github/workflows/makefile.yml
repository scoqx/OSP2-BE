name: Makefile CI

permissions:
  contents: write

on:
  push:
    branches: ["master"]
    paths-ignore:
      - '**.md'
      - 'assets/docs/changelog_be_r.txt'
      - 'assets/version.txt'
      - 'assets/version_changelog.txt'
      - '.gitignore'
      - 'docs/*'
      - 'build/*'
      - 'util/*'
  pull_request:
    branches: ["master"]
    paths-ignore:
      - '**.md'
      - 'assets/docs/changelog_be_r.txt'
      - 'assets/version.txt'
      - 'assets/version_changelog.txt'
      - '.gitignore'
      - 'docs/*'
      - 'build/*'
      - 'util/*'
  workflow_dispatch:

jobs:
  sync-version-assets:
    if: github.ref == 'refs/heads/master' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Regenerate version.txt and version_changelog.txt
        run: |
          cd build/qvm
          make ../../assets/version.txt ../../assets/version_changelog.txt
          echo "=== version.txt ==="
          cat ../../assets/version.txt
          echo "=== version_changelog.txt (line 1) ==="
          head -1 ../../assets/version_changelog.txt

      - name: Commit and push version assets to OSP2-PBE
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add assets/version.txt assets/version_changelog.txt
          if git diff --staged --quiet; then
            echo "Version assets already up to date in repo"
            exit 0
          fi
          git commit -m "Sync version.txt and version_changelog.txt from osp_version.h [skip ci]"
          git push

  linux:
    needs: sync-version-assets
    if: always() && (needs.sync-version-assets.result == 'success' || needs.sync-version-assets.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          ref: master
          fetch-depth: 0

      - name: Pull latest after version sync
        if: needs.sync-version-assets.result == 'success'
        run: git pull --ff-only origin master

      - name: Create version files
        run: |
          cd build/qvm
          make ../../assets/version.txt ../../assets/version_changelog.txt ../../assets/docs/changelog_be_r.txt

      - name: build-qvm
        working-directory: build/qvm
        run: |
          make

      - name: build-so
        working-directory: build/library
        run: |
          make MOD=osp2

      - uses: actions/upload-artifact@v7
        with:
          name: qvm-linux
          path: build/qvm/zz-osp-pak8be.pk3
          if-no-files-found: error
          retention-days: 5

      - name: Package Linux libraries for website
        run: |
          cd build/library/build/release-linux-x86_64/osp2
          tar -czf ../../../osp2-be-linux.tar.gz cgamex86_64.so uix86_64.so

      - uses: actions/upload-artifact@v7
        with:
          name: osp2-be-linux
          path: build/library/osp2-be-linux.tar.gz
          if-no-files-found: error
          retention-days: 5

  verify-build-artifacts:
    needs: [linux]
    if: >-
      github.ref == 'refs/heads/master' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8

      - name: Verify QVM pack and Linux library package
        run: |
          set -e
          missing=0
          check() {
            if [ ! -f "$1" ]; then
              echo "Missing: $1"
              missing=1
            else
              echo "OK: $1 ($(du -h "$1" | cut -f1))"
            fi
          }
          check "qvm-linux/zz-osp-pak8be.pk3"
          check "osp2-be-linux/osp2-be-linux.tar.gz"
          if [ "$missing" -ne 0 ]; then
            echo "Build artifact verification failed"
            exit 1
          fi
          echo "All builds produced required artifacts"

  create-release:
    if: success()
    needs: [verify-build-artifacts]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Create latest build
        uses: softprops/action-gh-release@v3
        with:
          tag_name: latest-build
          name: Latest Build
          prerelease: false
          files: |
            qvm-linux/zz-osp-pak8be.pk3
            osp2-be-linux/osp2-be-linux.tar.gz
          generate_release_notes: false

  deploy-to-gh-pages:
    needs: [verify-build-artifacts]
    if: success()
    runs-on: ubuntu-latest
    env:
      TARGET_REPO: konstalker/konstalker.github.io
      TARGET_BRANCH: main
      GIT_USER_NAME: GitHub Actions
      GIT_USER_EMAIL: actions@github.com
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: false

      - name: Debug artifacts structure
        run: |
          echo "=== Artifacts directory structure ==="
          if [ -d artifacts ]; then
            echo "Artifacts directory exists"
            ls -laR artifacts/ || echo "Cannot list artifacts directory"
            echo ""
            echo "=== All files in artifacts (find) ==="
            find artifacts -type f 2>/dev/null | head -20 || echo "No files found in artifacts"
            echo ""
            echo "=== Looking for specific files ==="
            for file in "zz-osp-pak8be.pk3" "osp2-be-linux.tar.gz"; do
              found=$(find artifacts -name "$file" -type f 2>/dev/null | head -1)
              if [ -n "$found" ]; then
                echo "Found: $file -> $found ($(du -h "$found" | cut -f1))"
              else
                echo "Missing: $file"
              fi
            done
          else
            echo "ERROR: artifacts directory does not exist"
            mkdir -p artifacts
          fi

      - name: Checkout target repo
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: target-repo

      - name: Checkout source repo for config and version files
        uses: actions/checkout@v6
        with:
          ref: master
          path: source-repo

      - name: Copy artifacts to assets folder
        run: |
          set -euo pipefail
          mkdir -p target-repo/assets
          copy_fail=0

          find_and_copy() {
            local filename="$1"
            local dest="$2"
            local found_file

            found_file=$(find artifacts -name "$filename" -type f 2>/dev/null | head -1)

            if [ -n "$found_file" ] && [ -f "$found_file" ]; then
              cp "$found_file" "$dest"
              echo "Copied: $found_file -> $dest ($(du -h "$dest" | cut -f1))"
              return 0
            fi

            echo "ERROR: $filename not found in artifacts"
            copy_fail=1
            return 1
          }

          find_and_copy "zz-osp-pak8be.pk3" "target-repo/assets/zz-osp-pak8be.pk3" || true
          find_and_copy "osp2-be-linux.tar.gz" "target-repo/assets/osp2-be-linux.tar.gz" || true

          if [ "$copy_fail" -ne 0 ]; then
            echo "ERROR: Required build artifacts missing; refusing to update website"
            exit 1
          fi

          for src_dst in \
            "source-repo/assets/version.txt:target-repo/assets/version.txt" \
            "source-repo/assets/version_changelog.txt:target-repo/assets/version_changelog.txt" \
            "source-repo/assets/OSP2.cfg:target-repo/assets/OSP2.cfg" \
            "source-repo/assets/OSP2English.cfg:target-repo/assets/OSP2English.cfg" \
            "source-repo/changelog_be.txt:target-repo/assets/changelog_be.txt"; do
            src="${src_dst%%:*}"
            dst="${src_dst##*:}"
            if [ -f "$src" ]; then
              cp "$src" "$dst"
              echo "Copied: $src -> $dst"
            else
              echo "Error: $src not found"
            fi
          done

          echo ""
          echo "=== Files in target-repo/assets ==="
          ls -lh target-repo/assets/ || echo "Assets directory is empty"
          echo ""
          echo "=== File count ==="
          ls -1 target-repo/assets/ | wc -l || echo "0"

          echo ""
          echo "=== Verification of critical files ==="
          for file in "zz-osp-pak8be.pk3" "osp2-be-linux.tar.gz"; do
            if [ -f "target-repo/assets/$file" ]; then
              echo "OK: $file exists ($(du -h target-repo/assets/$file | cut -f1))"
            else
              echo "MISSING: $file"
            fi
          done

      - name: Verify files before commit
        run: |
          echo "=== Verifying files in target-repo/assets ==="
          cd target-repo
          if [ ! -d assets ]; then
            echo "ERROR: assets directory does not exist!"
            exit 1
          fi

          echo "Files found:"
          ls -lh assets/ || echo "No files found"

          required_files=(
            "zz-osp-pak8be.pk3"
            "osp2-be-linux.tar.gz"
            "version.txt"
            "version_changelog.txt"
            "OSP2.cfg"
            "OSP2English.cfg"
            "changelog_be.txt"
          )

          missing_files=()
          for file in "${required_files[@]}"; do
            if [ ! -f "assets/$file" ]; then
              missing_files+=("$file")
              echo "ERROR: Required file missing: $file"
            else
              echo "OK: $file exists ($(du -h assets/$file | cut -f1))"
            fi
          done

          if [ ${#missing_files[@]} -gt 0 ]; then
            echo "ERROR: Some required files are missing!"
            exit 1
          fi

          echo "=== File verification complete ==="

      - name: Commit and push changes
        run: |
          cd target-repo
          git config user.name "${{ env.GIT_USER_NAME }}"
          git config user.email "${{ env.GIT_USER_EMAIL }}"

          echo "=== Git status before add ==="
          git status

          git add -A -f assets/

          for file in "osp2-be-linux.tar.gz" "zz-osp-pak8be.pk3" "version.txt" "version_changelog.txt" "OSP2.cfg" "OSP2English.cfg" "changelog_be.txt"; do
            if [ -f "assets/$file" ]; then
              git add -f "assets/$file"
              echo "Added: assets/$file"
            fi
          done

          echo "=== Git status after add ==="
          git status

          echo "=== Files staged for commit ==="
          git diff --cached --name-only || echo "No staged files"

          echo "=== Changes to be committed ==="
          git diff --cached --stat || echo "No changes"

          has_changes=false
          if [ -n "$(git diff --cached --name-only)" ]; then
            has_changes=true
            echo "Staged changes detected"
          fi
          if [ -n "$(git status --porcelain)" ]; then
            has_changes=true
            echo "Working directory changes detected"
          fi

          if [ "$has_changes" = "true" ]; then
            echo "Changes detected, committing..."
            git commit -m "Update build artifacts, version files and configs [auto]"
            echo "=== Commit created ==="
            git log -1 --stat
            echo "=== Pushing to ${{ env.TARGET_BRANCH }} ==="
            git push origin ${{ env.TARGET_BRANCH }} || {
              echo "ERROR: Push failed!"
              echo "Checking remote configuration..."
              git remote -v
              exit 1
            }
            echo "Changes committed and pushed successfully"
          else
            echo "No changes detected in repository"
            echo "=== Current files in assets ==="
            ls -lh assets/ || echo "Assets directory is empty or missing"
            echo "=== Git log (last 3 commits) ==="
            git log -3 --oneline
          fi

          echo ""
          echo "=== Final verification: files in assets ==="
          ls -lh assets/ || echo "Assets directory is empty or missing"

  deploy-to-status-server:
    needs: [verify-build-artifacts]
    if: success()
    runs-on: ubuntu-latest
    env:
      STATUS_REPO: scoqx/osp2be-status-server
      STATUS_BRANCH: main
      GIT_USER_NAME: GitHub Actions
      GIT_USER_EMAIL: actions@github.com
    steps:
      - name: Checkout OSP2-PBE (latest master after version sync)
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive
          path: source-repo

      - name: Pull latest master
        run: git -C source-repo pull --ff-only origin master

      - name: Build fresh version.txt and version_changelog.txt
        run: |
          cd source-repo/build/qvm
          make ../../assets/version.txt ../../assets/version_changelog.txt
          echo "=== version.txt ==="
          cat ../../assets/version.txt
          echo "=== version_changelog.txt (line 1) ==="
          head -1 ../../assets/version_changelog.txt

      - name: Checkout osp2be-status-server
        uses: actions/checkout@v6
        with:
          repository: ${{ env.STATUS_REPO }}
          ref: ${{ env.STATUS_BRANCH }}
          token: ${{ secrets.BE_SERVER_STATUS }}
          path: status-repo

      - name: Patch response.conf and version_changelog.txt
        run: |
          python3 source-repo/scripts/patch_osp2be_status_server.py \
            --version-txt source-repo/assets/version.txt \
            --changelog source-repo/assets/version_changelog.txt \
            --status-config source-repo/be_status_server.conf \
            --status-dir status-repo

      - name: Update mod_sig in deploy/response.conf
        working-directory: status-repo
        run: python3 gen_status_sig.py --write -c deploy/response.conf

      - name: Commit and push to osp2be-status-server
        run: |
          cd status-repo
          git config user.name "${{ env.GIT_USER_NAME }}"
          git config user.email "${{ env.GIT_USER_EMAIL }}"
          git add deploy/version_changelog.txt deploy/response.conf
          git diff --quiet --cached || git commit -m "Update version_changelog and status version [auto]"
          git push origin ${{ env.STATUS_BRANCH }}
